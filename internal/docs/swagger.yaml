basePath: /api
definitions:
  categories.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  categories.CreateCategoryRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  categories.UpdateCategoryRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  orders.CheckoutItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  orders.CheckoutRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/orders.CheckoutItemRequest'
        type: array
    required:
    - items
    type: object
  orders.OrderItemResponse:
    properties:
      image_url:
        type: string
      price:
        type: number
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
    type: object
  orders.OrderResponse:
    properties:
      created_at:
        type: string
      items:
        items:
          $ref: '#/definitions/orders.OrderItemResponse'
        type: array
      order_id:
        type: string
      order_number:
        type: string
      payment:
        $ref: '#/definitions/orders.PaymentResponse'
      status:
        type: string
      total_amount:
        type: number
    type: object
  orders.PaymentResponse:
    properties:
      amount:
        type: number
      expired_at:
        type: string
      expires_in:
        type: integer
      paid_at:
        type: string
      payment_id:
        type: string
      payment_method:
        type: string
      status:
        type: string
      va_number:
        type: string
    type: object
  products.CreateProductRequest:
    properties:
      category_id:
        type: string
      description:
        example: Sepatu olahraga nyaman dipakai
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      name:
        example: Sepatu Olahraga
        type: string
      price:
        example: 150000
        type: number
      stock:
        example: 10
        minimum: 0
        type: integer
    required:
    - category_id
    - name
    - price
    - stock
    type: object
  products.ProductResponse:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      slug:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  products.UpdateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    type: object
  sandboxes.PaySandboxRequest:
    properties:
      va_number:
        example: "8800112345678"
        type: string
    required:
    - va_number
    type: object
  sandboxes.SandboxPaymentResponse:
    properties:
      amount:
        type: number
      expired_at:
        type: string
      expires_in:
        type: integer
      items:
        items:
          $ref: '#/definitions/orders.OrderItemResponse'
        type: array
      order_id:
        type: string
      order_number:
        type: string
      paid_at:
        type: string
      payment_id:
        type: string
      payment_method:
        type: string
      status:
        type: string
      va_number:
        type: string
    type: object
  users.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: admin
        type: string
    type: object
  users.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      role_id:
        type: string
      user_id:
        type: string
    type: object
  users.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      full_name:
        example: John Doe
        type: string
      password:
        example: secret123
        type: string
      role_id:
        example: role-uuid-string
        type: string
      username:
        example: johndoe
        type: string
    type: object
  users.UpdateUserRequest:
    properties:
      full_name:
        example: John Doe Updated
        type: string
      is_active:
        example: true
        type: boolean
      password:
        example: ayambakar123lohyacik
        type: string
      role_id:
        example: role-uuid-string
        type: string
    type: object
  users.UserResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role_id:
        type: string
      username:
        type: string
    type: object
host: serverstaging-vps-5e6db201b3.asiahub.id
info:
  contact: {}
  description: API backend layanan e-commerce Sekolah Al-Hasra.
  title: E-Commerce Al-Hasra API
  version: "1.0"
paths:
  /categories:
    get:
      description: Get list of all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/categories.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category
      parameters:
      - description: Category Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/categories.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/categories.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Delete category by UUID
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category
      tags:
      - categories
    get:
      description: Get details of a single category by its UUID
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update category details by UUID
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Category Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/categories.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a category
      tags:
      - categories
  /orders:
    get:
      description: Get list of all submitted orders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/orders.OrderResponse'
            type: array
      summary: Get all orders
      tags:
      - Orders
  /orders/{id}:
    get:
      description: Get order details by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.OrderResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get order by ID
      tags:
      - Orders
  /orders/checkout:
    post:
      consumes:
      - application/json
      description: Process checkout without requiring user authentication (Guest Checkout)
      parameters:
      - description: Checkout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/orders.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/orders.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Process order checkout
      tags:
      - Orders
  /products:
    get:
      description: Get list of all active products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/products.ProductResponse'
            type: array
      summary: Get all products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product
      parameters:
      - description: Create Product Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/products.ProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create new product
      tags:
      - Products
  /products/{id}:
    delete:
      description: Soft delete product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete product
      tags:
      - Products
    get:
      description: Get product details by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.ProductResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product by ID
      tags:
      - Products
    put:
      consumes:
      - application/json
      description: Update product details
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Product Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.ProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update product
      tags:
      - Products
  /sandbox/pay:
    post:
      consumes:
      - application/json
      description: Process payment by VA Number and update status from PENDING to
        PAID
      parameters:
      - description: Sandbox Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sandboxes.PaySandboxRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Simulate VA Payment (Sandbox)
      tags:
      - Sandbox
  /sandbox/va/{va_number}:
    get:
      description: Get Virtual Account payment details by VA Number
      parameters:
      - description: VA Number
        in: path
        name: va_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sandboxes.SandboxPaymentResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inquiry Virtual Account status
      tags:
      - Sandbox
  /users:
    get:
      description: Get list of all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/users.UserResponse'
            type: array
      summary: Get all users
      tags:
      - Users
  /users/{id}:
    delete:
      description: Soft delete user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete user
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update user details including Role
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update user
      tags:
      - Users
  /users/login:
    post:
      consumes:
      - application/json
      description: Login and generate Access Token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Users
  /users/logout:
    post:
      description: Clear authentication cookie
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - Users
  /users/refresh:
    post:
      responses: {}
      tags:
      - user
  /users/register:
    post:
      consumes:
      - application/json
      description: Register a new user account with role
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register new user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
